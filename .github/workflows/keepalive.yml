# Render's free web service goes to sleep after ~15 min without traffic and
# the next visitor then waits up to a minute for it to wake up. A light ping
# every 10 minutes keeps it warm. (GitHub cron is best-effort, so it can be
# a few minutes late; delete this file if you upgrade the Render plan.)
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://chinesekeys.onrender.com/ -o /dev/null
